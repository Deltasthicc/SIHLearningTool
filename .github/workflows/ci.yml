name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lane 6 (Quality, Security, Release & Evidence) owns this file --
# SIH26101_TEAM_ORCHESTRATION.md section 5, Lane 6 immediate package.
#
# What this currently covers: backend pytest, frontend lint + production build, and a JSON
# well-formedness check on the docs/contracts/openapi.json scaffold.
#
# What this deliberately does NOT cover yet (open items, not silently skipped):
#   - Cross-domain Playwright/E2E smoke (SIH26101_MASTER_CHECKLIST.md 3.2) -- Playwright is not
#     installed in this repo yet; adding it is Lane 1/Lane 6 work, not assumed done here.
#   - Dependency/secret/SAST/DAST scans and SBOM (SIH26101_MASTER_CHECKLIST.md 5.3).
#   - Any deployment step -- there is no deploy target defined yet (see /deploy).

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism
          POSTGRES_DB: prism
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prism -d prism"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://prism:prism@localhost:5432/prism
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run backend test suite
        run: python -m pytest -v

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  contract-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docs/contracts/openapi.json is well-formed JSON
        run: python -c "import json; json.load(open('docs/contracts/openapi.json', encoding='utf-8'))"
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}